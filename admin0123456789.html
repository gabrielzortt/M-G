<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel Administrativo - M&G Utilidades</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="admin.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script>
</head>
<style>
    /* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:'Poppins',sans-serif;
    background:#111;
    color:#fff;
    min-height:100vh;
}

/* =========================
   TOPO
========================= */

.topbar{
    background:#181818;
    border-bottom:1px solid #2d2d2d;
    padding:25px 40px;
    position:sticky;
    top:0;
    z-index:999;
}

.logo-area h1{
    font-size:28px;
    font-weight:700;
    color:#fff;
}

.logo-area span{
    color:#9d9d9d;
    font-size:13px;
    letter-spacing:2px;
}

/* =========================
   CONTAINER
========================= */

.container{
    width:95%;
    max-width:1500px;
    margin:auto;
    padding:30px 0;
}

/* =========================
   DASHBOARD
========================= */

.dashboard{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:30px;
}

.card-stat{
    background:#1b1b1b;
    border:1px solid #2c2c2c;
    border-radius:16px;
    padding:30px;
    transition:.3s;
}

.card-stat:hover{
    transform:translateY(-4px);
    border-color:#555;
}

.card-stat i{
    font-size:28px;
    margin-bottom:15px;
    color:#d7d7d7;
}

.card-stat h3{
    font-size:32px;
    margin-bottom:5px;
}

.card-stat p{
    color:#9d9d9d;
}

/* =========================
   PAINEIS
========================= */

.panel{
    background:#1a1a1a;
    border:1px solid #2a2a2a;
    border-radius:20px;
    padding:25px;
    margin-bottom:30px;
}

.panel-header{
    margin-bottom:25px;
}

.panel-header h2{
    font-size:24px;
    font-weight:600;
}

/* =========================
   FORMULÁRIOS
========================= */

.product-form,
.category-form{
    display:flex;
    flex-direction:column;
    gap:15px;
}

input,
textarea,
select{
    width:100%;
    background:#0f0f0f;
    border:1px solid #333;
    color:#fff;
    border-radius:12px;
    padding:14px;
    font-size:15px;
    outline:none;
    transition:.3s;
}

textarea{
    resize:none;
    min-height:130px;
}

input:focus,
textarea:focus,
select:focus{
    border-color:#777;
}

button{
    border:none;
    cursor:pointer;
    transition:.3s;
}

/* =========================
   BOTÕES
========================= */

.category-form button,
.product-form button{
    background:#fff;
    color:#111;
    padding:14px;
    border-radius:12px;
    font-weight:600;
}

.category-form button:hover,
.product-form button:hover{
    background:#d8d8d8;
}

/* =========================
   CHECKBOX
========================= */

.checkbox{
    display:flex;
    align-items:center;
    gap:10px;
    color:#ddd;
}

.checkbox input{
    width:auto;
}

/* =========================
   UPLOAD
========================= */

.upload-box{
    background:#101010;
    border:2px dashed #555;
    border-radius:14px;
    padding:25px;
    text-align:center;
    cursor:pointer;
    transition:.3s;
}

.upload-box:hover{
    border-color:#999;
}

.upload-box input{
    display:none;
}

.preview-image{
    display:none;
    width:220px;
    height:220px;
    object-fit:cover;
    border-radius:14px;
    border:1px solid #444;
}

/* =========================
   BUSCA
========================= */

#search-product{
    margin-bottom:25px;
}

/* =========================
   GRID PRODUTOS
========================= */

.products-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:20px;
}

/* =========================
   CARD PRODUTO
========================= */

.product-card-admin{
    background:#111;
    border:1px solid #2f2f2f;
    border-radius:18px;
    overflow:hidden;
    transition:.3s;
}

.product-card-admin:hover{
    transform:translateY(-5px);
}

.product-card-admin img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.product-card-content{
    padding:18px;
}

.product-card-content h3{
    font-size:18px;
    margin-bottom:8px;
}

.product-card-content p{
    color:#a7a7a7;
    font-size:14px;
    margin-bottom:10px;
}

.product-card-content .price{
    font-size:22px;
    font-weight:700;
    margin-bottom:10px;
}

.status{
    display:inline-block;
    padding:6px 12px;
    border-radius:999px;
    font-size:12px;
    margin-bottom:15px;
}

.status.active{
    background:#143d22;
    color:#73ff9e;
}

.status.inactive{
    background:#451717;
    color:#ff8c8c;
}

/* =========================
   AÇÕES
========================= */

.card-actions{
    display:flex;
    gap:10px;
}

.btn-edit{
    flex:1;
    background:#2f2f2f;
    color:#fff;
    padding:12px;
    border-radius:10px;
}

.btn-delete{
    flex:1;
    background:#5e1f1f;
    color:#fff;
    padding:12px;
    border-radius:10px;
}

.btn-edit:hover{
    background:#444;
}

.btn-delete:hover{
    background:#7a2727;
}

/* =========================
   CATEGORIAS
========================= */

#categories-list{
    margin-top:20px;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.category-item{
    background:#0f0f0f;
    border:1px solid #333;
    padding:10px 16px;
    border-radius:999px;
    display:flex;
    align-items:center;
    gap:10px;
}

.category-item button{
    background:none;
    color:#ff7f7f;
    border:none;
}

/* =========================
   RESPONSIVO
========================= */

@media(max-width:768px){

    .topbar{
        padding:20px;
    }

    .logo-area h1{
        font-size:22px;
    }

    .dashboard{
        grid-template-columns:1fr;
    }

    .products-grid{
        grid-template-columns:1fr;
    }

}
</style>
<body>

<header class="topbar">

    <div class="logo-area">
        <h1>M&G Utilidades</h1>
        <span>Painel Administrativo</span>
    </div>

</header>

<main class="container">

    <!-- DASHBOARD -->

    <section class="dashboard">

        <div class="card-stat">
            <i class="fas fa-box"></i>
            <h3 id="total-products">0</h3>
            <p>Produtos</p>
        </div>

        <div class="card-stat">
            <i class="fas fa-tags"></i>
            <h3 id="total-categories">0</h3>
            <p>Categorias</p>
        </div>

        <div class="card-stat">
            <i class="fas fa-check-circle"></i>
            <h3 id="total-active">0</h3>
            <p>Ativos</p>
        </div>

        <div class="card-stat">
            <i class="fas fa-percent"></i>
            <h3 id="total-promos">0</h3>
            <p>Promoções</p>
        </div>

    </section>

    <!-- CATEGORIAS -->

    <section class="panel">

        <div class="panel-header">
            <h2>Categorias</h2>
        </div>

        <div class="category-form">

            <input
                type="text"
                id="category-name"
                placeholder="Nome da categoria">

            <button onclick="saveCategory()">
                Adicionar Categoria
            </button>

        </div>

        <div id="categories-list"></div>

    </section>

    <!-- PRODUTOS -->

    <section class="panel">

        <div class="panel-header">
            <h2>Produtos</h2>
        </div>

        <div class="product-form">

            <input
                type="text"
                id="product-name"
                placeholder="Nome do Produto">

            <textarea
                id="product-description"
                placeholder="Descrição do Produto"></textarea>

            <select id="product-category">
                <option value="">
                    Selecione uma categoria
                </option>
            </select>

            <input
                type="number"
                id="product-price"
                placeholder="Preço">

            <label class="checkbox">

                <input
                    type="checkbox"
                    id="product-promo">

                Produto em promoção

            </label>

            <input
                type="number"
                id="product-promo-price"
                placeholder="Preço promocional">

            <label class="upload-box">

                <span>
                    Selecionar imagem
                </span>

                <input
                    type="file"
                    id="product-image"
                    accept="image/*">

            </label>

            <img
                id="preview-image"
                class="preview-image">

            <label class="checkbox">

                <input
                    type="checkbox"
                    id="product-active"
                    checked>

                Produto ativo

            </label>

            <button onclick="saveProduct()">
                Salvar Produto
            </button>

        </div>

    </section>

    <!-- BUSCA -->

    <section class="panel">

        <div class="panel-header">
            <h2>Produtos Cadastrados</h2>
        </div>

        <input
            type="text"
            id="search-product"
            placeholder="Buscar produto...">

        <div
            class="products-grid"
            id="products-grid">

        </div>

    </section>

</main>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
getDatabase,
ref,
push,
set,
update,
remove,
onValue
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBGORHPeHqpzW1WCRaVQ3o4vNWCGhzxLXg",
  authDomain: "papai-d56a6.firebaseapp.com",
  databaseURL: "https://papai-d56a6-default-rtdb.firebaseio.com",
  projectId: "papai-d56a6",
  storageBucket: "papai-d56a6.firebasestorage.app",
  messagingSenderId: "421865458800",
  appId: "1:421865458800:web:dcc7b7948bbb9381cdb8b5"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const CLOUD_NAME = "dzophwnk2";
const UPLOAD_PRESET = "mg_produtos";

let categories = [];
let products = [];
let editingProduct = null;

async function uploadImage(file){

    const formData = new FormData();

    formData.append("file", file);
    formData.append("upload_preset", UPLOAD_PRESET);

    const response = await fetch(
        `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,
        {
            method:"POST",
            body:formData
        }
    );

    const data = await response.json();

    return data.secure_url;
}

window.saveCategory = async function(){

    const input =
    document.getElementById("category-name");

    const name = input.value.trim();

    if(!name){
        alert("Digite o nome da categoria.");
        return;
    }

    const newRef =
    push(ref(db,"categories"));

    await set(newRef,{
        name
    });

    input.value = "";
}

function loadCategories(){

    onValue(ref(db,"categories"),snapshot=>{

        const data = snapshot.val();

        categories = [];

        const list =
        document.getElementById("categories-list");

        const select =
        document.getElementById("product-category");

        list.innerHTML = "";

        select.innerHTML =
        '<option value="">Selecione uma categoria</option>';

        if(!data) return;

        Object.entries(data).forEach(([id,cat])=>{

            categories.push({
                id,
                ...cat
            });

            list.innerHTML += `
                <div class="category-item">
                    ${cat.name}
                    <button onclick="deleteCategory('${id}')">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
            `;

            select.innerHTML += `
                <option value="${cat.name}">
                    ${cat.name}
                </option>
            `;
        });

        updateDashboard();
    });
}

window.deleteCategory = async function(id){

    if(!confirm("Excluir categoria?"))
        return;

    await remove(ref(db,`categories/${id}`));
}

window.saveProduct = async function(){

    const name =
    document.getElementById("product-name").value;

    const description =
    document.getElementById("product-description").value;

    const category =
    document.getElementById("product-category").value;

    const price =
    parseFloat(
    document.getElementById("product-price").value
    );

    const promo =
    document.getElementById("product-promo").checked;

    const promoPrice =
    parseFloat(
    document.getElementById("product-promo-price").value
    ) || 0;

    const active =
    document.getElementById("product-active").checked;

    const imageFile =
    document.getElementById("product-image").files[0];

    if(!name || !category){
        alert("Preencha os campos.");
        return;
    }

    let image = "";

    if(imageFile){
        image = await uploadImage(imageFile);
    }

    const productData = {
        name,
        description,
        category,
        price,
        promo,
        promoPrice,
        image,
        active,
        createdAt:Date.now()
    };

    if(editingProduct){

        await update(
            ref(db,`products/${editingProduct}`),
            productData
        );

        editingProduct = null;

    }else{

        const newRef =
        push(ref(db,"products"));

        await set(newRef,productData);

    }

    clearForm();
}

function clearForm(){

    document.getElementById("product-name").value="";
    document.getElementById("product-description").value="";
    document.getElementById("product-category").value="";
    document.getElementById("product-price").value="";
    document.getElementById("product-promo-price").value="";
    document.getElementById("product-image").value="";
    document.getElementById("product-promo").checked=false;
    document.getElementById("product-active").checked=true;

    document.getElementById("preview-image").style.display="none";
}

function loadProducts(){

    onValue(ref(db,"products"),snapshot=>{

        const data = snapshot.val();

        products = [];

        if(data){

            Object.entries(data).forEach(([id,p])=>{

                products.push({
                    id,
                    ...p
                });

            });

        }

        renderProducts();
        updateDashboard();
    });
}

function renderProducts(search=""){

    const grid =
    document.getElementById("products-grid");

    grid.innerHTML="";

    let filtered = products;

    if(search){

        filtered =
        products.filter(p=>
            p.name.toLowerCase()
            .includes(search.toLowerCase())
        );

    }

    filtered.forEach(product=>{

        grid.innerHTML += `
        <div class="product-card-admin">

            <img src="${product.image || 'https://via.placeholder.com/400'}">

            <div class="product-card-content">

                <h3>${product.name}</h3>

                <p>${product.category}</p>

                <div class="price">
                    R$ ${Number(product.price).toFixed(2)}
                </div>

                <span class="status ${product.active ? 'active':'inactive'}">
                    ${product.active ? 'Ativo':'Inativo'}
                </span>

                <div class="card-actions">

                    <button
                    class="btn-edit"
                    onclick="editProduct('${product.id}')">
                    Editar
                    </button>

                    <button
                    class="btn-delete"
                    onclick="deleteProduct('${product.id}')">
                    Excluir
                    </button>

                </div>

            </div>

        </div>
        `;
    });
}

window.editProduct = function(id){

    const product =
    products.find(p=>p.id===id);

    if(!product) return;

    editingProduct = id;

    document.getElementById("product-name").value =
    product.name;

    document.getElementById("product-description").value =
    product.description;

    document.getElementById("product-category").value =
    product.category;

    document.getElementById("product-price").value =
    product.price;

    document.getElementById("product-promo").checked =
    product.promo;

    document.getElementById("product-promo-price").value =
    product.promoPrice || "";

    document.getElementById("product-active").checked =
    product.active;
}

window.deleteProduct = async function(id){

    if(!confirm("Excluir produto?"))
        return;

    await remove(ref(db,`products/${id}`));
}

function updateDashboard(){

    document.getElementById("total-products").textContent =
    products.length;

    document.getElementById("total-categories").textContent =
    categories.length;

    document.getElementById("total-active").textContent =
    products.filter(p=>p.active).length;

    document.getElementById("total-promos").textContent =
    products.filter(p=>p.promo).length;
}

document
.getElementById("search-product")
.addEventListener("input",e=>{

    renderProducts(e.target.value);

});

document
.getElementById("product-image")
.addEventListener("change",e=>{

    const file = e.target.files[0];

    if(!file) return;

    const preview =
    document.getElementById("preview-image");

    preview.src =
    URL.createObjectURL(file);

    preview.style.display="block";

});

loadCategories();
loadProducts();

</script>

</body>
</html>
